########################################
# Network & Security
########################################
bind 0.0.0.0
protected-mode yes
port 6379
# Password is provided dynamically at container runtime via --requirepass
timeout 300
tcp-keepalive 60

########################################
# Memory Management
########################################
maxmemory 512mb
maxmemory-policy allkeys-lru

########################################
# Persistence
########################################
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes

save 900 1
save 300 10
save 60 10000

########################################
# Logging
########################################
loglevel notice